[package]
name = "rust_lib_moonlight_p2p"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
flutter_rust_bridge = "=2.12.0"
libp2p = { version = "0.56.0", features = ["tokio", "noise", "yamux", "tcp", "quic", "mdns", "dns", "gossipsub", "kad", "identify", "ping", "relay", "dcutr", "macros", "websocket"] }
log = "0.4.33"
once_cell = "1.21.4"
tokio = { version = "1.53.1", features = ["full"] }
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
